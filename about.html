<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>About Us | Paradise Escape Resort</title>
    <meta name="description" content="Learn about Paradise Escape Resort.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header id="nav"></header>
    <section class="hero mini" data-bg="about.jpg">
        <div class="wrap">
            <h1>About Paradise Escape</h1>
            <p>Ten years of warm hospitality by the sea.</p>
        </div>
    </section>
    <section>
        <div class="wrap" id="aboutBlock"></div>
    </section>
    <section id="facilities" class="alt">
        <div class="wrap">
            <div class="head rv">
                <h2>Facilities</h2>
                <p>Designed for comfort.</p>
            </div>
            <div class="grid" id="facGrid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"></div>
        </div>
    </section>
    <section id="experience" class="">
        <div class="wrap">
            <div class="head rv">
                <h2>Experiences</h2>
                <p>Beyond the room.</p>
            </div>
            <div class="grid" id="expGrid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))"></div>
        </div>
    </section>
    <section id="testimonials" class="alt">
        <div class="wrap">
            <div class="head rv">
                <h2>Guest Reviews</h2>
                <p>What guests say.</p>
            </div>
            <div id="testi"></div>
        </div>
    </section>

    <footer id="footer"></footer>
    <script src="js/script.js"></script>
</body>

</html>
